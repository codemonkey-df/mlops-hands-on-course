# Lab-only: committed secrets (see M1). Real setups: SealedSecrets / ESO.
apiVersion: v1
kind: Secret
metadata:
  name: llm-s3            # read by the fetch-weights initContainer
type: Opaque
stringData:
  S3_ACCESS_KEY: mlops
  S3_SECRET_KEY: mlops-minio-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm
type: Opaque
stringData:
  # Clients send `Authorization: Bearer <key>`. LiteLLM requires the "sk-" prefix.
  LITELLM_MASTER_KEY: sk-mlops-lab-master
