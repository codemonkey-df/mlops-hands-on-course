# Secrets are NAMESPACED: pods in `mlflow` cannot read Secrets in `storage`.
# So MLflow gets its own copy of the credentials it needs.
# (Real setups sync them with External Secrets Operator / Reflector.)
apiVersion: v1
kind: Secret
metadata:
  name: mlflow-backends
  namespace: mlflow
type: Opaque
stringData:
  PG_PASSWORD: mlops-pg-secret
  # boto3 reads exactly these names; MLflow uses boto3 for s3:// artifacts.
  AWS_ACCESS_KEY_ID: mlops
  AWS_SECRET_ACCESS_KEY: mlops-minio-secret
