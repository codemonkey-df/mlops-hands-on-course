# Secrets consumed by the Dagster release. Created OUTSIDE the chart so that
# `helm uninstall` never deletes credentials and values.yaml holds no passwords.
#
# Instance storage (runs, events, schedules) -> Postgres db "dagster".
# The chart expects exactly this key name: postgresql-password.
apiVersion: v1
kind: Secret
metadata:
  name: dagster-postgresql
  namespace: dagster
type: Opaque
stringData:
  postgresql-password: mlops-pg-secret
---
# Env vars for OUR code (resources read them via dg.EnvVar).
# In-cluster DNS names: pods must not go through the Ingress hostname.
apiVersion: v1
kind: Secret
metadata:
  name: dagster-lab-env
  namespace: dagster
type: Opaque
stringData:
  S3_ENDPOINT_URL: http://minio.storage.svc.cluster.local:9000
  S3_ACCESS_KEY: mlops
  S3_SECRET_KEY: mlops-minio-secret
  MLFLOW_TRACKING_URI: http://mlflow.mlflow.svc.cluster.local:5000
  MLFLOW_ENABLE_PROXY_MULTIPART_DOWNLOAD: "false"
  MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "false"
