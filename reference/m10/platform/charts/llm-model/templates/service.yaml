apiVersion: v1
kind: Service
metadata:
  name: {{ include "llm.fullname" . }}
  labels: {{- include "llm.labels" . | nindent 4 }}
spec:
  selector: {{- include "llm.selectorLabels" . | nindent 4 }}
  ports:
    - name: http          # ServiceMonitor scrapes this port by NAME
      port: {{ .Values.service.port }}
      targetPort: http
    {{- if and .Values.mock .Values.dcgm.enabled }}
    - name: dcgm          # dcgm-exporter's conventional port
      port: 9400
      targetPort: dcgm
    {{- end }}
