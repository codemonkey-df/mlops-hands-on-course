# One release = one model = one Deployment + Service.
#   helm install small-chat platform/charts/llm-model -f platform/llm/small-chat.yaml
# Why one per model? Each model needs its own GPU budget, its own scaling and
# its own rollout. One vLLM process serves exactly one model anyway.

# mock: true  -> tiny CPU image that speaks vLLM's API (this lab)
# mock: false -> the real vllm/vllm-openai image on a GPU node
mock: true

image:
  real: {repository: vllm/vllm-openai, tag: v0.31.0}
  mock: {repository: harbor.local:8085/mlops/mock-vllm, tag: "0.1.0"}
  pullPolicy: IfNotPresent
imagePullSecrets: [{name: harbor-pull}]

model:
  # The name clients send in {"model": "..."}. It MUST match the router's
  # `model: hosted_vllm/<servedName>` or every request is a 404.
  servedName: small-chat
  weightsPrefix: small-chat      # s3://<weights.bucket>/<weightsPrefix>/
  maxModelLen: 4096              # context window; must fit in the KV cache
  maxNumSeqs: 8                  # concurrent sequences per replica
  gpuMemoryUtilization: 0.90     # share of GPU memory vLLM pre-allocates
  tensorParallelSize: 1          # GPUs per replica (must equal gpu.count)
  dtype: auto
  extraArgs: []                  # e.g. ["--enable-prefix-caching"]

weights:
  bucket: llm-weights
  s3Endpoint: http://minio.storage.svc.cluster.local:9000
  secretName: llm-s3             # keys: S3_ACCESS_KEY, S3_SECRET_KEY
  cacheSize: 2Gi                 # emptyDir limit; real models need 15-150Gi (use a PVC)

# Only used by the mock: how long "loading" takes and how fast it "decodes".
sim: {loadSeconds: 20, ttftSeconds: 0.15, tokensPerSecond: 40}

gpu:
  count: 1                       # nvidia.com/gpu limit (real mode only)
  runtimeClassName: nvidia       # set by the NVIDIA GPU operator

replicas: 1
service: {port: 8000}

# M10: Prometheus Operator scrapes these ports. The `release` label MUST
# match the kube-prometheus-stack Helm release name, otherwise Prometheus
# never sees the ServiceMonitor (the #1 "empty Grafana" cause).
metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    releaseLabel: kube-prometheus-stack

# Mock-only sidecar that speaks dcgm-exporter's metric names. Real clusters
# run NVIDIA's dcgm-exporter as a DaemonSet on every GPU node instead.
dcgm:
  enabled: false

# KEDA ScaledObject. minReplicas: 1 is the HTTP-safe default: scale-to-zero
# never comes back, because a 0-replica Deployment emits no Prometheus
# series for the scaler to see. Demo minReplicas: 0 in the tweak section.
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  pollingInterval: 15          # how often KEDA queries Prometheus
  cooldownPeriod: 180          # ONLY the 1 -> 0 wait; 4 -> 1 is HPA behavior
  threshold: "2"               # waiting requests that one replica should handle
  prometheusUrl: http://kube-prometheus-stack-prometheus.observability.svc:9090
  # HPA scaleDown window: without it, a 10s quiet period drops replicas
  # and the next burst scales up again ("flapping").
  scaleDownStabilizationSeconds: 120

resources:
  mock: {requests: {cpu: 50m, memory: 96Mi}, limits: {memory: 256Mi}}
  real: {requests: {cpu: "4", memory: 32Gi}, limits: {memory: 48Gi}}

probes:
  # Model loading takes seconds (mock) to 10+ minutes (70B from disk).
  # startupProbe holds off liveness/readiness until the FIRST success:
  # periodSeconds * failureThreshold = max load time (here 10 min).
  startup: {periodSeconds: 10, failureThreshold: 60}
  readiness: {periodSeconds: 5, failureThreshold: 2}
  liveness: {periodSeconds: 15, failureThreshold: 4}
