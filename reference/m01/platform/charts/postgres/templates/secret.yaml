{{- /*
Password handling, a classic Helm gotcha:
  `randAlphaNum` alone would generate a NEW password on every `helm upgrade`,
  while the database keeps the OLD one -> every client breaks.
  `lookup` reads the Secret that already exists in the cluster and reuses it.
  (lookup returns nothing in `helm template` / --dry-run: it has no cluster.)
*/ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "postgres.fullname" .) -}}
{{- $password := .Values.auth.password -}}
{{- if not $password -}}
  {{- if $existing -}}
    {{- $password = index $existing.data "password" | b64dec -}}
  {{- else -}}
    {{- $password = randAlphaNum 24 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.auth.username | quote }}
  password: {{ $password | quote }}
