# A Job runs pods to COMPLETION (vs a Deployment that keeps them running).
# This one creates the buckets every later module needs. It's idempotent
# (`--ignore-existing`), so re-applying it is safe.
#
# Jobs are immutable: to re-run, `kubectl delete job minio-buckets` first.
# ttlSecondsAfterFinished garbage-collects it automatically.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets
  namespace: storage
spec:
  backoffLimit: 6                  # retries with exponential back-off (MinIO may still be starting)
  ttlSecondsAfterFinished: 600     # auto-delete 10 min after completion
  template:
    spec:
      restartPolicy: OnFailure     # Jobs need OnFailure or Never (not Always)
      containers:
        - name: mc
          # Distroless image: no shell, so we call `mc` directly (no `sh -c`).
          image: cgr.dev/chainguard/minio-client:latest@sha256:d8a93c5d335509ff353774eefec8f82fa2a2a975e800139702232d8be3dbe6b9
          args: [mb, --ignore-existing, lab/datasets, lab/dvc, lab/mlflow, lab/dagster, lab/llm-weights]
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: minio-root, key: MINIO_ROOT_USER}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: minio-root, key: MINIO_ROOT_PASSWORD}}
            # `mc` reads aliases from MC_HOST_<alias>=http://user:pass@host:port.
            # $(VAR) is expanded BY KUBERNETES from env vars defined ABOVE this one
            # (order matters; there is no shell involved).
            - name: MC_HOST_lab
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio:9000
            - name: HOME                   # mc writes ~/.mc; non-root needs a writable HOME
              value: /tmp
