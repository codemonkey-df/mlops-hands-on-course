# A Secret holds credentials. `stringData` lets you write plain text; the API
# server stores it base64-encoded in `data`. Base64 is NOT encryption: anyone
# with `get secret` RBAC can read it.
#
# Committing secrets to git is acceptable ONLY for this throwaway lab.
# Real setups: SealedSecrets / SOPS / External Secrets Operator + Vault.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: storage
type: Opaque
stringData:
  MINIO_ROOT_USER: mlops                   # also used as S3 access key in the lab
  MINIO_ROOT_PASSWORD: mlops-minio-secret  # min. 8 characters or MinIO refuses to start
