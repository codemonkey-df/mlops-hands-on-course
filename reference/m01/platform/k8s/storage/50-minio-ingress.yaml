# An Ingress routes external HTTP by hostname/path to Services.
# Traefik (bundled with k3s) is the Ingress controller that implements it.
# Placeholder YOUR_SERVER_IP: run `make configure-ip` (or set SERVER_IP=...).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minio
  namespace: storage
spec:
  ingressClassName: traefik
  rules:
    - host: minio.YOUR_SERVER_IP.nip.io     # web console
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: minio, port: {name: console}}
    - host: s3.YOUR_SERVER_IP.nip.io        # S3 API, used from the host (DVC, DuckDB, mc)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: minio, port: {name: s3}}
