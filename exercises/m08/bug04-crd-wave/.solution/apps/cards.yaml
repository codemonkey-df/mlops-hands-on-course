apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ex-m08-bug04-cards
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: http://192.168.1.202:3300/mlops/ex-m08-bug04.git
    targetRevision: main
    path: cards
  destination:
    server: https://kubernetes.default.svc
    namespace: ex-m08-bug04
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
