apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: small-chat
  labels:
    app.kubernetes.io/name: llm-model
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-model
      app.kubernetes.io/instance: small-chat
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
