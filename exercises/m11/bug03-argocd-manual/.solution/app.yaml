apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://192.168.1.202:3300/mlops/mlops.git
    targetRevision: main
    path: platform/gitops/serving
  destination:
    server: https://kubernetes.default.svc
    namespace: serving
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
