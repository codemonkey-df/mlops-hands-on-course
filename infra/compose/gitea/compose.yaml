# Gitea (git server + Actions) and one act_runner, all on-prem.
#   cd infra/compose/gitea && docker compose up -d
# Gitea UI: http://<SERVER_IP>:3300   SSH: <SERVER_IP>:2222
name: gitea

services:
  gitea:
    image: gitea/gitea:28.1.0
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      # Skip the web installer: config comes from env (GITEA__section__KEY).
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      # The URL clients see. An IP, so CI job containers and k3d pods
      # (ArgoCD, M8) can reach it too; nothing resolves "gitea.local" here.
      GITEA__server__ROOT_URL: http://${SERVER_IP}:3300/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: ${SERVER_IP}
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
      # `uses: actions/checkout@v4` would be fetched from github.com by default.
      # "self" = resolve actions from THIS Gitea (we mirror nothing -> no internet).
      GITEA__actions__DEFAULT_ACTIONS_URL: self
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    ports:
      - "3300:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/healthz"]
      interval: 10s
      retries: 30

  runner:
    image: gitea/act_runner:0.6.1
    restart: unless-stopped
    depends_on:
      gitea: { condition: service_healthy }
    environment:
      CONFIG_FILE: /config.yaml
      # Jobs see this as github.server_url and clone from it. Job containers run
      # on their own network where "gitea" does not resolve -> use the host SERVER_IP.
      # Stored in .runner at registration: changing it means re-registering.
      GITEA_INSTANCE_URL: http://${SERVER_IP}:3300
      # One-time token: `docker compose exec -u git gitea gitea actions generate-runner-token`
      GITEA_RUNNER_REGISTRATION_TOKEN: ${RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: lxc-runner-1
    volumes:
      - ./runner-config.yaml:/config.yaml:ro
      - runner-data:/data # .runner registration file lives here
      - /var/run/docker.sock:/var/run/docker.sock # jobs run as sibling containers

volumes:
  gitea-data:
  runner-data:
